name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Lint tools are pinned (from PyPI) so results do not depend on the
  # runner image.  Keep in sync with the Contributing section of README.md.
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "23.1.3"

jobs:
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"
          echo "CLANG_FORMAT=$(pipx environment --value PIPX_BIN_DIR)/clang-format" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          "$CLANG_FORMAT" --version
          find src include examples tests -name '*.cc' -o -name '*.h' \
            | xargs "$CLANG_FORMAT" --Werror --dry-run
          "$CLANG_FORMAT" --Werror --dry-run build.cc

  build-test:
    name: Build & Test (${{ matrix.compiler }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang cmake ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCCBUILD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCCBUILD_SANITIZERS=address,undefined

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  clang-tidy:
    name: Static Analysis (clang-tidy)
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
          pipx install "clang-tidy==${CLANG_TIDY_VERSION}"
          echo "CLANG_TIDY=$(pipx environment --value PIPX_BIN_DIR)/clang-tidy" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$CLANG_TIDY" --version
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCCBUILD_CLANG_TIDY=ON \
            -DCCBUILD_CLANG_TIDY_EXE="$CLANG_TIDY" \
            -DBUILD_TESTING=OFF

      - name: Build with clang-tidy
        run: cmake --build build

  end-to-end:
    name: End-to-End (install, examples, self-host)
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build

      # Same steps as the README (tests are enabled, as by default).
      - name: Build and install
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ccbuild"
          cmake --build build
          cmake --install build
          echo "$RUNNER_TEMP/ccbuild/bin" >> "$GITHUB_PATH"

      - name: Check the install contains only ccbuild
        run: |
          cd "$RUNNER_TEMP/ccbuild"
          find . -type f | sort | tee "$RUNNER_TEMP/installed.txt"
          if grep -qE 'gtest|gmock' "$RUNNER_TEMP/installed.txt"; then
            echo "::error::googletest was installed alongside ccbuild"
            exit 1
          fi

      - name: CLI basics
        run: |
          ccbuild --version
          ccbuild --help
          if ccbuild --no-such-flag; then exit 1; fi

      - name: Build examples
        run: |
          cp -r examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP/examples/hello-world"
          ccbuild
          .ccbuild/bin/hello
          cd ../loganalyzer
          ccbuild
          .ccbuild/bin/logsummary data/sample.csv
          .ccbuild/bin/logview data/sample.csv
          ccbuild | grep "nothing to do"

      - name: Concurrent invocations take turns
        run: |
          cd "$RUNNER_TEMP/examples/hello-world"
          rm -rf .ccbuild
          ccbuild > first.log 2>&1 & first=$!
          ccbuild > second.log 2>&1 & second=$!
          status=0
          wait "$first" || status=1
          wait "$second" || status=1
          cat first.log second.log
          [ "$status" -eq 0 ]
          .ccbuild/bin/hello

      - name: Self-host (ccbuild builds itself from build.cc)
        run: |
          ccbuild
          .ccbuild/bin/ccbuild --version
          # The self-built libraries must be complete: build an example
          # against them (this catches sources missing from build.cc).
          cp .ccbuild/lib/libccbuildlib.a .ccbuild/lib/libninjacore.a \
            "$RUNNER_TEMP/ccbuild/lib/"
          cd "$RUNNER_TEMP/examples/hello-world"
          rm -rf .ccbuild
          ccbuild
          .ccbuild/bin/hello

  coverage:
    name: Coverage
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build lcov

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCCBUILD_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Generate coverage report
        run: cmake --build build --target coverage

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage.filtered.info
          fail_ci_if_error: false
